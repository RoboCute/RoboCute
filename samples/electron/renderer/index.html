<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>RoboCute Electron Demo</title>
  <style>
    :root {
      --topbar-h: 56px;
      --sidebar-w: 320px;
      --bg: #16181d;
      --panel: #1e2128;
      --panel2: #23262e;
      --border: #30343d;
      --text: #d6dae2;
      --text-dim: #8b919d;
      --accent: #4da3ff;
      --accent2: #7bd88f;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; overflow: hidden;
      user-select: none; }
    #app { display: grid; height: 100vh;
      grid-template-rows: var(--topbar-h) 1fr;
      grid-template-columns: 1fr var(--sidebar-w); }
    /* ---------- top bar ---------- */
    #topbar { grid-row: 1; grid-column: 1 / 3; display: flex; align-items: center;
      gap: 12px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
    #topbar .logo { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
    #topbar .logo span { color: var(--accent); }
    .badge { font: 11px/1 Consolas, monospace; padding: 4px 8px; border-radius: 10px;
      background: var(--panel2); border: 1px solid var(--border); color: var(--text-dim); }
    .badge.shared { color: var(--accent2); border-color: #2c4a35; }
    .badge.readback { color: #e8c07d; border-color: #4a3f2c; }
    #topbar .spacer { flex: 1; }
    button { font: 12px/1 "Segoe UI", sans-serif; color: var(--text); background: var(--panel2);
      border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
    button:hover { background: #2b2f38; border-color: #3d4254; }
    button:active { background: #31353f; }
    button.on { color: var(--accent2); border-color: #2c4a35; }
    kbd { font: 10px Consolas, monospace; background: #14161a; border: 1px solid var(--border);
      border-radius: 3px; padding: 1px 4px; color: var(--text-dim); }
    /* ---------- stage (native viewport covers this area) ---------- */
    #stage { grid-row: 2; grid-column: 1; position: relative; background: #101216; overflow: hidden; }
    #stage .placeholder { position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px; color: var(--text-dim); }
    #stage .placeholder .spin { width: 26px; height: 26px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: rot 1s linear infinite; }
    @keyframes rot { to { transform: rotate(360deg); } }
    #viewport { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
    /* ---------- sidebar ---------- */
    #sidebar { grid-row: 2; grid-column: 2; background: var(--panel); border-left: 1px solid var(--border);
      padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .card h3 { margin: 0 0 10px; font-size: 12px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 1px; }
    .stat { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 0; }
    .stat .k { color: var(--text-dim); }
    .stat .v { font-family: Consolas, monospace; }
    #fpsValue { font-size: 30px; font-weight: 600; color: var(--accent2); }
    #fpsUnit { color: var(--text-dim); margin-left: 4px; }
    .row { display: flex; gap: 8px; margin-top: 6px; }
    .row button { flex: 1; padding: 9px 0; }
    #engineStatus.ok { color: var(--accent2); }
    #engineStatus.bad { color: var(--danger); }
    .hint { color: var(--text-dim); font-size: 12px; margin: 4px 0; }
    .hint b { color: var(--text); font-weight: 600; }
    /* ---------- toast ---------- */
    #toast { position: fixed; left: 16px; bottom: 16px; background: #262b33; color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 12px;
      opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 60vw;
      box-shadow: 0 4px 18px rgba(0,0,0,.5); }
    #toast.show { opacity: 1; }
    #toast .path { color: var(--accent); font-family: Consolas, monospace; font-size: 11px; }
  </style>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo">RoboCute <span>Electron</span></div>
      <div class="badge" id="modeBadge">…</div>
      <div class="badge" id="backendBadge">dx</div>
      <div class="spacer"></div>
      <button id="btnTurntable" class="on" title="切换场景旋转动画 [T]">旋转动画 <kbd>T</kbd></button>
      <button id="btnScreenshot" title="保存当前渲染画面 [S]">保存截图 <kbd>S</kbd></button>
    </header>

    <main id="stage">
      <div class="placeholder" id="placeholder">
        <div class="spin"></div>
        <div id="placeholderText">等待引擎初始化…</div>
      </div>
      <canvas id="viewport"></canvas>
    </main>

    <aside id="sidebar">
      <div class="card">
        <h3>实时状态</h3>
        <div><span id="fpsValue">--</span><span id="fpsUnit">fps</span></div>
        <div class="stat"><span class="k">分辨率</span><span class="v" id="statRes">--</span></div>
        <div class="stat"><span class="k">呈现模式</span><span class="v" id="statMode">--</span></div>
        <div class="stat"><span class="k">引擎</span><span class="v" id="engineStatus">连接中…</span></div>
      </div>
      <div class="card">
        <h3>操作</h3>
        <div class="row">
          <button id="btnShot2">保存截图 <kbd>S</kbd></button>
          <button id="btnTurn2">旋转动画 <kbd>T</kbd></button>
        </div>
      </div>
      <div class="card">
        <h3>视口交互</h3>
        <div class="hint"><b>左键拖拽</b> — 环绕相机</div>
        <div class="hint"><b>滚轮</b> — 推拉相机</div>
        <div class="hint"><b>S</b> — 保存截图 · <b>T</b> — 旋转动画</div>
        <div class="hint" id="modeHint"></div>
      </div>
    </aside>
  </div>
  <div id="toast"></div>
  <script src="renderer.js"></script>
</body>
</html>
